{{/* Workbench design system plus the build-time code palettes. */}}
{{ $siteCSS := resources.Get "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $siteCSS.RelPermalink }}" integrity="{{ $siteCSS.Data.Integrity }}">
{{ partialCached "code-themes.html" . }}

{{ if .Params.keeps }}
{{ $keepsCSS := resources.Get "css/keeps.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $keepsCSS.RelPermalink }}" integrity="{{ $keepsCSS.Data.Integrity }}">
{{ end }}
