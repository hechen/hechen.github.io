{{ define "main" }}
<div class="gradient-bg min-h-[60vh]">
  <section class="border-b border-slate-200/60 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-6 sm:px-10 pt-16 sm:pt-24 pb-12 sm:pb-16">
      <p class="text-sm font-medium text-accent dark:text-accent-dark">Browse</p>
      <h1 class="mt-4 text-4xl sm:text-6xl font-bold tracking-tight leading-tight">{{ .Title }}</h1>
      <p class="mt-5 max-w-2xl text-lg leading-relaxed text-slate-600 dark:text-slate-400">
        Browse the site's taxonomy archive without falling back to the old theme defaults.
      </p>
    </div>
  </section>

  <section>
    <div class="max-w-5xl mx-auto px-6 sm:px-10 py-14 sm:py-18">
      <div class="flex flex-wrap gap-3">
        {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="inline-flex items-center rounded-full border border-slate-200/80 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:border-accent/30 dark:hover:border-accent-dark/30 hover:text-accent dark:hover:text-accent-dark transition-colors">
          {{ .LinkTitle }}
          {{ with .Pages }}<span class="ml-2 text-slate-400 dark:text-slate-500">{{ len . }}</span>{{ end }}
        </a>
        {{ end }}
      </div>
    </div>
  </section>
</div>
{{ end }}
