name: Build and deploy Hugo site to Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Keep the old catalog URL current for shipped apps. Unchanged catalogs
    # skip the Hugo build and deployment.
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - name: Fetch the authoritative catalog
        uses: actions/checkout@v4
        with:
          repository: hechen/ai-model-catalog
          ref: main
          persist-credentials: false
      - name: Validate catalog
        run: python3 validate.py
      - name: Check the compatibility endpoint
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          changed = True
          if os.environ['EVENT_NAME'] == 'schedule':
              url = 'https://hechen.github.io/apps/closet/cloud-model-catalog.json'
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      changed = response.read() != Path('cloud-model-catalog.json').read_bytes()
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'deploy={str(changed).lower()}\n')
          PY
      - name: Save validated catalog for the site build
        if: steps.compare.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-model-catalog
          path: cloud-model-catalog.json
          retention-days: 1

  build:
    # Always run on push and PR — gives PR authors a green/red signal that
    # the Hugo + Tailwind pipeline still compiles before merge. Deploy job
    # below excludes PRs. Scheduled runs build only when the catalog changed.
    needs: catalog
    if: needs.catalog.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -qO ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore the catalog at its legacy URL
        uses: actions/download-artifact@v4
        with:
          name: cloud-model-catalog
          path: static/apps/closet
      - name: Install Tailwind deps
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # Hard-code https://. configure-pages emits http:// until the
          # Pages cert is provisioned for the apex, which can take hours
          # after switching from legacy branch-deploy to workflow mode.
          # GitHub serves both schemes regardless, but canonical / og:url
          # tags need https for SEO and link previews.
          hugo \
            --gc \
            --minify \
            --baseURL "https://hechen.github.io/"
      - name: Build Tailwind CSS bundle
        # Phase 2: compile assets/css/main.css → public/css/tailwind.css
        # at build time. The legacy hand-edited HTML pages reference
        # /css/tailwind.css instead of the cdn.tailwindcss.com runtime
        # script that fragility-of-Safari was breaking on iPad.
        # Runs AFTER Hugo so it overlays into the same public/ tree.
        run: npm run build:css
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Pushes, manual runs and catalog checks publish from master. PRs don't.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
