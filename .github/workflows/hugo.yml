name: Build and deploy Hugo site to Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # Always run on push and PR — gives PR authors a green/red signal that
    # the Hugo + Tailwind pipeline still compiles before merge. Deploy job
    # below is gated on push to master so PRs don't deploy to production.
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -qO ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Tailwind deps
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          # Hard-code https://. configure-pages emits http:// until the
          # Pages cert is provisioned for the apex, which can take hours
          # after switching from legacy branch-deploy to workflow mode.
          # GitHub serves both schemes regardless, but canonical / og:url
          # tags need https for SEO and link previews.
          hugo \
            --gc \
            --minify \
            --baseURL "https://hechen.github.io/"
      - name: Build Tailwind CSS bundle
        # Phase 2: compile assets/css/main.css → public/css/tailwind.css
        # at build time. The legacy hand-edited HTML pages reference
        # /css/tailwind.css instead of the cdn.tailwindcss.com runtime
        # script that fragility-of-Safari was breaking on iPad.
        # Runs AFTER Hugo so it overlays into the same public/ tree.
        run: npm run build:css
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Only deploy on push to master. PR builds upload the artifact for
    # CI validation but don't replace the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
